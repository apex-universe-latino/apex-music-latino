<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Mindset Caro — CMS & Datos</title>
<style>
  :root{ --red:#e60000; --bg:#0c0c0d; --panel:#161618; --panel2:#1d1d20; --border:#2a2a2e; --text:#f5f5f5; --dim:#9a9aa2; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,Arial,sans-serif; }
  header{ display:flex; align-items:center; gap:16px; padding:16px 22px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; letter-spacing:.5px; }
  header h1 b{ color:var(--red); }
  .tabs{ display:flex; gap:6px; margin-left:auto; }
  .tab{ background:transparent; color:var(--dim); border:1px solid var(--border); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
  .tab.active{ background:var(--red); color:#fff; border-color:var(--red); }
  main{ max-width:1100px; margin:0 auto; padding:24px; }
  .bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  select, input, textarea, button{ font:inherit; color:var(--text); }
  select, input[type=text], input[type=password], textarea{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; width:100%; }
  textarea{ min-height:60px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  .btn{ background:var(--red); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .group{ margin:0 0 14px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .group > summary{ cursor:pointer; padding:12px 16px; background:var(--panel); font-weight:700; text-transform:uppercase; letter-spacing:.5px; font-size:12px; color:var(--red); }
  .field{ display:grid; grid-template-columns:240px 1fr; gap:12px; padding:12px 16px; border-top:1px solid var(--border); align-items:start; }
  .field label{ color:var(--dim); font-size:12px; word-break:break-all; padding-top:9px; }
  .field .meta{ font-size:10px; color:#5a5a62; display:block; margin-top:3px; }
  .muted{ color:var(--dim); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  td.payload{ font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); max-width:340px; word-break:break-word; }
  .pill{ display:inline-block; background:var(--panel2); border:1px solid var(--border); border-radius:99px; padding:2px 9px; font-size:11px; }
  .toast{ position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--red); padding:12px 18px; border-radius:10px; opacity:0; transition:.2s; }
  .toast.show{ opacity:1; }
  .hidden{ display:none; }
  .stats{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 18px; min-width:120px; }
  .stat b{ display:block; font-size:22px; color:var(--red); }
  .stat span{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
</style>
</head>
<body>
<header>
  <h1>Mindset <b>Caro</b> · Panel</h1>
  <div class="tabs">
    <button class="tab active" data-tab="cms">Contenido (CMS)</button>
    <button class="tab" data-tab="data">Datos entrantes</button>
  </div>
</header>

<main>
  <!-- Admin key gate -->
  <div class="bar" id="keyBar">
    <input type="password" id="adminKey" placeholder="Admin key (MC_ADMIN_KEY / INGEST_ADMIN_KEY)" style="max-width:380px" />
    <button class="btn" id="saveKey">Conectar</button>
    <span class="muted">La clave se guarda solo en esta sesión del navegador.</span>
  </div>

  <!-- ===================== CMS TAB ===================== -->
  <section id="tab-cms">
    <div class="bar">
      <label class="muted">Página:</label>
      <select id="site" style="max-width:200px">
        <option value="landing">landing</option>
        <option value="diagnostico">diagnostico</option>
        <option value="global">global</option>
      </select>
      <button class="btn ghost" id="reload">Recargar</button>
      <button class="btn" id="saveAll" style="margin-left:auto">Guardar cambios</button>
    </div>
    <div id="cmsFields"><p class="muted">Conecta con tu admin key para cargar el contenido.</p></div>
  </section>

  <!-- ===================== DATA TAB ===================== -->
  <section id="tab-data" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input type="text" id="filterApp" placeholder="Filtrar por source_app (opcional)" style="max-width:260px" />
      <button class="btn ghost" id="reloadData">Recargar</button>
      <label class="muted" style="margin-left:auto"><input type="checkbox" id="autoRefresh" /> Auto-refrescar (10s)</label>
    </div>
    <div style="overflow:auto; max-height:70vh; border:1px solid var(--border); border-radius:12px;">
      <table id="eventsTable">
        <thead><tr>
          <th>Hora</th><th>source_app</th><th>event</th><th>visitor</th><th>payload</th><th>url / utm</th>
        </tr></thead>
        <tbody><tr><td colspan="6" class="muted">Sin datos cargados.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const API_CONTENT = '/api/mc-content';
const API_INGEST  = '/api/ingest';
let adminKey = sessionStorage.getItem('mc_admin_key') || '';
let rows = [];          // raw content rows for current site
let autoTimer = null;

if (adminKey) $('#adminKey').value = adminKey;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const tab = btn.dataset.tab;
  $('#tab-cms').classList.toggle('hidden', tab!=='cms');
  $('#tab-data').classList.toggle('hidden', tab!=='data');
  if (tab==='data') loadEvents();
}));

$('#saveKey').addEventListener('click', () => {
  adminKey = $('#adminKey').value.trim();
  sessionStorage.setItem('mc_admin_key', adminKey);
  toast('Clave guardada'); loadContent();
});

// ===================== CMS =====================
async function loadContent(){
  const site = $('#site').value;
  try{
    const r = await fetch(`${API_CONTENT}?site=${encodeURIComponent(site)}&raw=1`);
    rows = await r.json();
    if (!Array.isArray(rows)) { $('#cmsFields').innerHTML = `<p class="muted">Error: ${JSON.stringify(rows)}</p>`; return; }
    renderFields(rows);
  }catch(e){ $('#cmsFields').innerHTML = `<p class="muted">No se pudo cargar: ${e.message}</p>`; }
}

function renderFields(list){
  const groups = {};
  list.forEach(row => { const g = row.grp || row.field.split('.')[0]; (groups[g] ||= []).push(row); });
  const wrap = $('#cmsFields'); wrap.innerHTML = '';
  Object.keys(groups).sort().forEach(g => {
    const det = document.createElement('details'); det.className='group'; det.open = true;
    det.innerHTML = `<summary>${g}</summary>`;
    groups[g].forEach(row => {
      const isJson = row.value_json !== null && row.value_json !== undefined;
      const isAsset = !!row.asset_url;
      const val = isJson ? JSON.stringify(row.value_json, null, 2) : (isAsset ? row.asset_url : (row.value_text || ''));
      const type = isJson ? 'json' : (isAsset ? 'asset' : 'text');
      const field = document.createElement('div'); field.className='field';
      const ctrl = isJson || (val && val.length > 60)
        ? `<textarea data-field="${row.field}" data-type="${type}">${escapeHtml(val)}</textarea>`
        : `<input type="text" data-field="${row.field}" data-type="${type}" value="${escapeHtml(val)}" />`;
      field.innerHTML = `<label>${row.field}<span class="meta">${type}${isAsset?' · URL imagen/video':''}</span></label><div>${ctrl}</div>`;
      det.appendChild(field);
    });
    wrap.appendChild(det);
  });
}

async function saveAll(){
  if(!adminKey){ toast('Falta admin key'); return; }
  const site = $('#site').value;
  const inputs = document.querySelectorAll('[data-field]');
  const fields = [];
  inputs.forEach(el => {
    const f = el.dataset.field, type = el.dataset.type, v = el.value;
    const row = { site, field: f };
    if (type === 'json') { try { row.value_json = JSON.parse(v); } catch(e){ throw new Error(`JSON inválido en ${f}`); } }
    else if (type === 'asset') row.asset_url = v;
    else row.value_text = v;
    fields.push(row);
  });
  try{
    const r = await fetch(API_CONTENT, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ admin_key: adminKey, fields }) });
    const data = await r.json();
    if(!r.ok){ toast('Error: '+(data.error||r.status)); return; }
    toast(`Guardado (${data.saved} campos)`);
  }catch(e){ toast(e.message); }
}

$('#reload').addEventListener('click', loadContent);
$('#site').addEventListener('change', loadContent);
$('#saveAll').addEventListener('click', () => { try{ saveAll(); }catch(e){ toast(e.message);} });

// ===================== INCOMING DATA =====================
async function loadEvents(){
  if(!adminKey){ toast('Falta admin key'); return; }
  const app = $('#filterApp').value.trim();
  const q = `?admin_key=${encodeURIComponent(adminKey)}&limit=200${app?`&source_app=${encodeURIComponent(app)}`:''}`;
  try{
    const r = await fetch(API_INGEST + q);
    const data = await r.json();
    if(!Array.isArray(data)){ toast('Error: '+(data.error||'')); return; }
    renderEvents(data);
  }catch(e){ toast('No se pudo cargar: '+e.message); }
}

function renderEvents(list){
  // stats
  const apps = new Set(list.map(e=>e.source_app));
  const visitors = new Set(list.map(e=>e.visitor_id).filter(Boolean));
  $('#stats').innerHTML = `
    <div class="stat"><b>${list.length}</b><span>eventos (últimos)</span></div>
    <div class="stat"><b>${apps.size}</b><span>apps fuente</span></div>
    <div class="stat"><b>${visitors.size}</b><span>visitantes únicos</span></div>`;
  const tb = $('#eventsTable tbody');
  if(!list.length){ tb.innerHTML = '<tr><td colspan="6" class="muted">Sin eventos.</td></tr>'; return; }
  tb.innerHTML = list.map(e => {
    const t = new Date(e.received_at).toLocaleString('es-CO');
    const utm = e.utm && Object.keys(e.utm).length ? `<div class="muted">utm: ${escapeHtml(JSON.stringify(e.utm))}</div>` : '';
    return `<tr>
      <td>${t}</td>
      <td><span class="pill">${escapeHtml(e.source_app||'')}</span></td>
      <td>${escapeHtml(e.event||'')}</td>
      <td class="muted">${escapeHtml((e.visitor_id||'').slice(0,12))}</td>
      <td class="payload">${escapeHtml(JSON.stringify(e.payload||{}))}</td>
      <td>${escapeHtml((e.url||'').slice(0,60))}${utm}</td>
    </tr>`;
  }).join('');
}

$('#reloadData').addEventListener('click', loadEvents);
$('#filterApp').addEventListener('keydown', e => { if(e.key==='Enter') loadEvents(); });
$('#autoRefresh').addEventListener('change', e => {
  clearInterval(autoTimer);
  if(e.target.checked) autoTimer = setInterval(loadEvents, 10000);
});

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// boot
if (adminKey) loadContent();
</script>
</body>
</html>
